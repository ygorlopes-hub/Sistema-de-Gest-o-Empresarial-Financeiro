<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Acesso - Sistema Gerencial</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background-color: #f4f5f7; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card { border: none; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 100%; max-width: 400px; padding: 2rem; background: #fff; }
    </style>
</head>
<body>
    <div class="login-card text-center">
        <h3 class="fw-bold mb-1"><i class="bi bi-shield-lock-fill text-dark"></i> BL EMBALAGENS</h3>
        <p class="text-muted small mb-4">Insira suas credenciais para continuar</p>
        
        {% if erro %}
        <div class="alert alert-danger small py-2">{{ erro }}</div>
        {% endif %}

        <form action="/login" method="POST">
            <div class="mb-3 text-start">
                <label class="form-label fw-bold small text-muted">Usuário</label>
                <input type="text" name="usuario" class="form-control bg-light" required autocomplete="off">
            </div>
            <div class="mb-4 text-start">
                <label class="form-label fw-bold small text-muted">Senha</label>
                <input type="password" name="senha" class="form-control bg-light" required>
            </div>
            <button type="submit" class="btn btn-dark w-100 fw-bold">Entrar no Sistema</button>
        </form>
    </div>
</body>
</html>
